<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bybuzz – Create content, earn rewards</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap">
<style>
:root{color-scheme:light;--bg:#f6f7fb;--sf:#fff;--sf2:#eef1f7;--ln:#dfe4ee;--tx:#12151f;--mu:#5b6579;--ac:#f5a40b;--acT:#0b0b0b;--acx:#a35f00;--ok:#16895a;--okT:#fff;--bad:#d3384a;--hd:rgba(246,247,251,.88);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px}
button,input,select{font:inherit;color:inherit}
a{color:var(--acx)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.w{max-width:1040px;margin:0 auto;padding:0 16px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hd);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
nav{display:flex;align-items:center;gap:6px;padding:10px 0}
.logo{font-weight:800;font-size:1.3rem;letter-spacing:-.03em;margin-right:auto;background:none;border:0;cursor:pointer;padding:0}
.logo i{font-style:normal;color:var(--acx)}
.nb{background:none;border:0;padding:8px 12px;border-radius:10px;cursor:pointer;color:var(--mu);font-weight:600}
.nb:hover,.nb.on{color:var(--tx);background:var(--sf)}
.btn{background:var(--ac);color:var(--acT);border:0;border-radius:12px;padding:12px 22px;font-weight:800;cursor:pointer;transition:filter .15s,transform .15s}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn.ghost{background:var(--sf);color:var(--tx);border:1px solid var(--ln)}
.btn.sm{padding:7px 14px;font-size:.88rem;border-radius:10px}
.btn.full{width:100%}
.banner{margin:18px 0;border:1px solid var(--ln);border-radius:24px;padding:28px 22px;background:radial-gradient(70% 120% at 100% 0%,rgba(247,166,0,.28),transparent 60%),linear-gradient(180deg,var(--sf),var(--bg))}
.pill{display:inline-block;font-size:.8rem;font-weight:600;padding:4px 12px;border-radius:99px;background:var(--sf2);border:1px solid var(--ln);color:var(--mu);margin:0 6px 8px 0}
.pill.ac{background:rgba(247,166,0,.14);border-color:rgba(247,166,0,.5);color:var(--acx)}
h1{font-size:clamp(1.9rem,6.4vw,3.2rem);line-height:1.08;letter-spacing:-.035em;margin:6px 0 10px;font-weight:800;max-width:16ch}
h2{font-size:1.25rem;letter-spacing:-.02em;margin:34px 0 12px}
.lead{color:var(--mu);font-size:1.1rem;margin:0 0 20px;max-width:46ch}
.lead b{color:var(--tx)}
.cols{display:grid;gap:18px}
.aside{order:-1}
@media(min-width:900px){.cols{grid-template-columns:1fr 340px;align-items:start}.aside{order:0;position:sticky;top:76px}body{padding-bottom:0}}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:20px}
.big{font-size:2.8rem;font-weight:800;letter-spacing:-.04em;color:var(--acx);line-height:1}
.mu{color:var(--mu)}
.bar{height:8px;border-radius:9px;background:var(--sf2);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ac)}
.steps{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.step b.n{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--ac);color:var(--acT);font-weight:800;margin-bottom:10px}
.step h3{margin:0 0 4px;font-size:1.05rem}
.step p{margin:0;color:var(--mu);font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--sf);border:1px solid var(--ln);border-radius:99px;padding:7px 14px;font-weight:500}
.tl{margin:0;padding:0;list-style:none}
.tl li{display:flex;gap:14px;padding:0 0 18px;position:relative}
.tl li:before{content:"";position:absolute;left:7px;top:18px;bottom:0;width:2px;background:var(--ln)}
.tl li:last-child:before{display:none}
.tl li:after{content:"";width:16px;height:16px;border-radius:50%;background:var(--ac);flex:none;order:-1;margin-top:3px}
.tl b{display:block}
.fine{font-size:.88rem;color:var(--mu)}
label{display:block;font-weight:600;margin:14px 0 5px}
input,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--bg)}
select option{background:var(--sf)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:14px 0;border-top:1px solid var(--ln)}
.row a{word-break:break-all}
.st{font-size:.8rem;font-weight:700;padding:3px 11px;border-radius:99px;border:1px solid var(--ln);background:var(--sf2)}
.st.approved{color:var(--ok);border-color:var(--ok)}.st.paid{background:var(--ok);color:var(--okT);border-color:var(--ok)}.st.rejected{color:var(--bad);border-color:var(--bad)}.st.pending{color:var(--acx);border-color:var(--acx)}
dialog{border:1px solid var(--ln);border-radius:22px;background:var(--sf);color:var(--tx);padding:24px;width:min(440px,calc(100% - 24px))}
dialog::backdrop{background:rgba(10,12,20,.6)}
.cta{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--hd);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--ln);display:flex;gap:12px;align-items:center}
.cta div{flex:1;font-weight:800;line-height:1.2}.cta small{display:block;color:var(--mu);font-weight:500}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ac);color:var(--acT);font-weight:700;padding:10px 18px;border-radius:12px;z-index:9;max-width:90%}
footer{padding:30px 0 40px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

.hero{padding:40px 0 10px}
.hero h1{max-width:14ch;font-size:clamp(2.2rem,7.5vw,4rem)}
.cta2{display:flex;gap:10px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}
.stat{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px}
.stat b{display:block;font-size:1.5rem;letter-spacing:-.03em}.stat span{color:var(--mu);font-size:.88rem}
.feat{display:grid;gap:14px;border:1px solid rgba(245,164,11,.5);border-radius:22px;padding:22px;background:radial-gradient(80% 140% at 100% 0%,rgba(245,164,11,.22),transparent 60%),var(--sf);cursor:pointer;text-align:left;width:100%}
.feat h2{margin:4px 0 4px;font-size:1.6rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.cc{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:18px;cursor:pointer;transition:border-color .15s,transform .15s}
.cc:hover{border-color:var(--ac);transform:translateY(-2px)}
.cc h3{margin:0;font-size:1.1rem;line-height:1.3}
.sp{display:flex;align-items:center;gap:10px;font-weight:600}
.av{width:34px;height:34px;border-radius:10px;background:var(--ac);color:#0b0b0b;display:grid;place-items:center;font-weight:800;flex:none}
.rw{font-size:1.7rem;font-weight:800;letter-spacing:-.03em;color:var(--acx);line-height:1}.rw small{font-size:.8rem;color:var(--mu);font-weight:500;letter-spacing:0}
.meta{display:flex;gap:8px 14px;flex-wrap:wrap;color:var(--mu);font-size:.88rem}
.chips{margin-bottom:16px}.chip{cursor:default}.fl{cursor:pointer;font-family:inherit;color:var(--tx)}.fl.on{background:var(--tx);color:var(--bg)}
.sec{display:flex;align-items:center;gap:12px;margin:40px 0 8px;font-size:1.4rem;padding-bottom:10px;border-bottom:3px solid var(--ac)}
.sub{color:var(--mu);margin:10px 0 16px}
.tier,.pc{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--ln);border-radius:12px;background:var(--sf)}
.tier{margin-bottom:8px}.tier b{min-width:150px}.tier span,.pc small{color:var(--mu)}
.tier i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:800;font-size:.85rem;flex:none}
.pgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.pc{border-left:4px solid var(--ac);font-weight:700}.pc small{display:block;font-weight:400}
.pc i{width:34px;height:34px;border-radius:8px;background:#0b0b0b;color:var(--ac);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:.78rem;flex:none}
.ck{display:flex;gap:8px;align-items:center;font-weight:500;margin:6px 0}.ck input{width:auto}
@media(max-width:560px){.nb{padding:8px 8px;font-size:.86rem}nav{flex-wrap:wrap}}
</style>
</head>
<body>
<header><div class="w"><nav id="nav"></nav></div></header>
<main class="w" id="app"></main>
<footer class="w fine" id="foot">Rewards are paid only for verified and approved submissions. Each campaign's terms, eligibility and content guidelines apply. Demo build: data is saved only in this browser.</footer>
<dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='bybuzz-v2',D=864e5,usd=n=>'$'+Number(n||0).toLocaleString();
const IDEAS=['How Bybit P2P works','How to become a P2P merchant','Your first P2P trade','Buying or selling crypto through P2P','P2P tips for beginners','Your Bybit P2P experience','And more!'];
const TIERS=[['B','Bronze Creator','500 – 10K Followers','#cd7f32'],['S','Silver Creator','10K – 30K Followers','#9ea3a8'],['G','Gold Creator','30K – 80K Followers','#d9a21b'],['P','Platinum Creator','80K – 150K Followers','#46a7c9'],['D','Diamond Creator','150K+ Followers','#6a4fd0']];
const PL=['Instagram Reels','YouTube Shorts','TikTok Videos','X Posts','Telegram Posts','Facebook Reels'];
const RX={Instagram:/^https?:\/\/(www\.)?instagram\.com\/(reel|reels|p)\/\S+/i,YouTube:/^https?:\/\/((www|m)\.youtube\.com\/shorts\/|youtu\.be\/)\S+/i,TikTok:/^https?:\/\/((www|vm)\.)?tiktok\.com\/\S+/i,X:/^https?:\/\/(www\.)?(x|twitter)\.com\/\S+\/status\/\S+/i,Telegram:/^https?:\/\/t\.me\/\S+/i,Facebook:/^https?:\/\/((www|m)\.)?(facebook\.com|fb\.watch)\/\S+/i};
function seed(){const n=Date.now();return{me:null,users:{},subs:[],apps:[],camps:[
{id:1,sponsor:'Bybit',title:'Bybit P2P Creator Campaign',brief:'Create a short video explaining or promoting Bybit P2P, publish it on Instagram Reels or YouTube Shorts, and submit the link. No complicated production required. A smartphone and your creativity is enough.',cat:'Video',platforms:['Instagram Reels','YouTube Shorts'],reward:15,cap:100,end:n+30*D,status:'live',funded:true,bybit:true},
{id:2,sponsor:'Sample Labs',sample:1,title:'Explain Base to a beginner',brief:'Post an original thread of 6+ posts that explains Base to a first-time user.',cat:'Post',platforms:['X Posts'],reward:10,cap:20,end:n+14*D,status:'live',funded:true},
{id:3,sponsor:'Sample Labs',sample:1,title:'Best crypto meme of the week',brief:'Share an original, friendly meme about onchain life.',cat:'Post',platforms:['X Posts','Telegram Posts'],reward:5,cap:40,end:n+9*D,status:'live',funded:true},
{id:4,sponsor:'Sample Safe',sample:1,title:'Wallet safety in 30 seconds',brief:'Make a short vertical video with one practical tip for keeping a wallet safe.',cat:'Video',platforms:['TikTok Videos','YouTube Shorts'],reward:12,cap:25,end:n+20*D,status:'live',funded:true}]}}
let S=null;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S)S=seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let view='home',arg=null,filt='All',after=null;
const me=()=>S.me?S.users[S.me]:null,C=id=>S.camps.find(c=>c.id==id);
const dl=c=>Math.max(0,Math.ceil((c.end-Date.now())/D)),used=c=>S.subs.filter(s=>s.cid==c.id&&(s.status=='approved'||s.status=='paid')).length,nsub=c=>S.subs.filter(s=>s.cid==c.id).length;
const live=()=>S.camps.filter(c=>c.status=='live'&&c.funded);
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2300)}
function go(v,a){view=v;arg=a||null;render();scrollTo(0,0)}
function nav(){const u=me(),b=(v,t)=>`<button class="nb ${view==v?'on':''}" data-go="${v}">${t}</button>`;
$('#nav').innerHTML=`<button class="logo" data-go="home" aria-label="Bybuzz home">By<i>buzz</i></button>${u?b('mine','My submissions'):''}${u&&u.admin?b('admin','Review'):''}<button class="btn sm" data-act="${u?'who':'login'}">${u?esc(u.name.split(' ')[0]):'Log in'}</button>`}
const card=c=>`<button class="cc" data-go="camp" data-id="${c.id}"><div class="sp"><span class="av">${esc(c.sponsor[0])}</span>${esc(c.sponsor)}${c.sample?' <span class="st">Sample</span>':''}</div><h3>${esc(c.title)}</h3><div class="rw">${usd(c.reward)} <small>USDT per approved</small></div><div class="meta"><span>${esc(c.platforms.join(' · '))}</span></div><div class="meta"><span>${Math.max(0,c.cap-used(c))} slots left</span><span>${dl(c)} days left</span><span>${nsub(c)} entries</span></div></button>`;
function home(){const L=live(),f=L.filter(c=>filt=='All'||c.cat==filt),F=L.find(c=>c.bybit),paid=S.subs.filter(s=>s.status=='paid').reduce((a,s)=>a+(C(s.cid)||{reward:0}).reward,0);
return`<section class="hero"><h1>Create content. Earn rewards.</h1><p class="lead">Pick a campaign from a sponsor, post your content, submit the link and get paid in USDT for every approved submission.</p><div class="cta2"><button class="btn" data-act="list">Browse campaigns</button><button class="btn ghost" data-go="${me()&&me().sponsor?'build':'apply'}">Sponsor a campaign</button></div></section>
<div class="stats"><div class="stat"><b>${L.length}</b><span>Live campaigns</span></div><div class="stat"><b>${S.subs.length}</b><span>Submissions</span></div><div class="stat"><b>${usd(paid)}</b><span>Paid out</span></div></div>
${F?`<button class="feat" data-go="camp" data-id="${F.id}"><div><span class="pill ac">Featured · Exclusive for Web3 communities</span><h2>${esc(F.title)}</h2><p class="mu" style="margin:0">Create → Publish → Submit → Earn ${usd(F.reward)}</p></div><div class="rw">${usd(F.reward)} <small>USDT per approved submission · ${dl(F)} days left</small></div></button>`:''}
<h2 id="list">Live campaigns</h2><div class="chips">${['All','Video','Post'].map(x=>`<button class="chip fl ${x==filt?'on':''}" data-filt="${x}">${x}</button>`).join('')}</div><div class="grid">${f.map(card).join('')||'<p class="mu">No live campaigns in this category yet.</p>'}</div>
<h2>Run a campaign on Bybuzz</h2><div class="card"><p class="mu" style="margin-top:0">Want creators to make content for your project? Apply as a sponsor. Prize pools are funded before a campaign goes live.</p><button class="btn ghost" data-go="${me()&&me().sponsor?'build':'apply'}">${me()&&me().sponsor?'Create a campaign':'Apply to sponsor'}</button></div>`}
function camp(){const c=C(arg);if(!c)return'<p class="mu">Campaign not found.</p>';const d=dl(c),tot=30,p=Math.min(100,Math.round(used(c)/c.cap*100)),ended=d==0;
return`<p><button class="nb" data-go="home">&larr; All campaigns</button></p><div class="cols"><div><div class="sp"><span class="av">${esc(c.sponsor[0])}</span>${esc(c.sponsor)}${c.sample?' <span class="st">Sample</span>':''}</div><h1 style="margin-top:14px">${esc(c.title)}</h1><p class="lead">${esc(c.brief)}</p>
<div class="chips">${c.platforms.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>
<h2 class="sec">How to earn ${usd(c.reward)}</h2><div class="steps">${[['Create','Make your content for this campaign.'],['Publish','Post it on '+c.platforms.join(' or ')+'.'],['Submit','Send your content link here.'],['Earn','Get '+usd(c.reward)+' USDT for every approved submission.']].map((x,i)=>`<div class="card step"><b class="n">${i+1}</b><h3>${x[0]}</h3><p>${esc(x[1])}</p></div>`).join('')}</div>
${c.bybit?`<h2 class="sec">You can create content about</h2><div class="chips">${IDEAS.map(i=>`<span class="chip">${i}</span>`).join('')}</div><h2 class="sec">Creator tiers</h2><p class="sub">Anyone who creates crypto-related content can join. Tiers are based on audience size.</p>${TIERS.map(t=>`<div class="tier"><i style="background:${t[3]}">${t[0]}</i><b>${t[1]}</b><span>${t[2]}</span></div>`).join('')}`:''}
<h2 class="sec">Timeline</h2><ul class="tl"><li><div><b>Campaign runs</b><span class="mu">Until ${new Date(c.end).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}</span></div></li><li><div><b>Content review</b><span class="mu">Up to 7 days after the campaign closes</span></div></li><li><div><b>Reward credited</b><span class="mu">Within 3 days after review</span></div></li></ul>
<h2 class="sec">Terms</h2><div class="card fine">Terms, eligibility and content guidelines apply. Only verified and approved submissions will qualify for rewards. Mark promotional content as required by each platform and local rules.${c.bybit?" Reward amounts and tier thresholds are subject to Bybit's official program rules. Cryptocurrency trading involves risk.":''}</div></div>
<aside class="aside"><div class="card"><div class="mu">Reward</div><div class="big">${usd(c.reward)} USDT</div><div class="mu">for every approved submission</div><div class="bar" aria-hidden="true"><i style="width:${p}%"></i></div><div class="fine">${Math.max(0,c.cap-used(c))} of ${c.cap} reward slots left · ${nsub(c)} entries</div><div class="fine" style="margin:4px 0 14px">${ended?'Campaign closed':d+' days left'}</div><button class="btn full" data-act="join" data-id="${c.id}" ${ended?'disabled':''}>Join the campaign</button></div></aside></div>`}
function mine(){const u=me();if(!u)return'<h2>My submissions</h2><p class="mu">Log in to see your submissions.</p>';const L=S.subs.filter(s=>s.email==S.me),ok=L.filter(s=>s.status=='approved'||s.status=='paid'),earn=ok.reduce((a,s)=>a+(C(s.cid)||{reward:0}).reward,0);
return`<h2>My submissions</h2><div class="card"><div class="big">${usd(earn)}</div><div class="mu">${ok.length} approved · ${L.filter(s=>s.status=='paid').length} paid</div><p><button class="btn ghost" data-act="logout">Log out</button></p></div><h2>History</h2>${L.map(s=>`<div class="row"><span><b>${esc((C(s.cid)||{}).title)}</b><br><span class="fine">${esc(s.platform)}</span><br><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.url)}</a></span><span class="st ${s.status}">${s.status=='pending'?'In review':s.status}</span></div>`).join('')||'<p class="mu">Nothing yet. Pick a campaign and submit your first link.</p>'}`}
function board(){const m={};S.subs.filter(s=>s.status=='approved'||s.status=='paid').forEach(s=>{m[s.email]=m[s.email]||{n:s.name,c:0,t:s.tier||''};m[s.email].c++});const L=Object.values(m).sort((a,b)=>b.c-a.c);
return`<h2>Leaderboard</h2><p class="mu">Ranked by approved submissions across all campaigns.</p>${L.map((u,i)=>`<div class="row"><span><b>${i+1}. ${esc(u.n)}</b> <span class="fine">${esc(u.t)}</span></span><span class="st approved">${u.c} approved</span></div>`).join('')||'<p class="mu">No approved submissions yet. Be the first on the board.</p>'}`}
function apply(){const u=me(),a=u&&S.apps.find(x=>x.email==S.me);
if(a)return`<h2>Sponsor application</h2><div class="card"><span class="st ${a.status=='approved'?'approved':'pending'}">${a.status}</span><p class="mu">${a.status=='approved'?'You can now create campaigns.':'The Bybuzz team will review your application soon.'}</p></div>`;
return`<h2>Apply to sponsor</h2><div class="card" style="max-width:560px"><label for="a1">Organisation</label><input id="a1"><label for="a2">Website</label><input id="a2" type="url" placeholder="https://"><label for="a3">What content do you want creators to make?</label><input id="a3"><label for="a4">Budget</label><select id="a4"><option>Under $200</option><option>$200 to $1,000</option><option>Over $1,000</option></select><p><button class="btn" data-act="apply">${u?'Send application':'Log in to apply'}</button></p></div>`}
function build(){return`<h2>New campaign</h2><div class="card" style="max-width:560px"><label for="c1">Title</label><input id="c1"><label for="c2">Brief and rules</label><input id="c2"><label for="c3">Type</label><select id="c3"><option>Video</option><option>Post</option></select><label>Platforms</label>${PL.map((p,i)=>`<label class="ck"><input type="checkbox" class="cp" value="${p}">${p}</label>`).join('')}<label for="c4">Reward per approved submission (USDT)</label><input id="c4" type="number" min="1" value="10"><label for="c5">Max rewarded submissions</label><input id="c5" type="number" min="1" value="20"><label for="c6">Days to run</label><input id="c6" type="number" min="1" value="14"><p class="fine">Pool = reward × max submissions. The campaign goes live once the Bybuzz team confirms it is funded.</p><button class="btn" data-act="build">Send for review</button></div>`}
function admin(){const u=me();if(!u||!u.admin)return'<p class="mu">Reviewers only.</p>';
return`<h2>Sponsor applications</h2>${S.apps.map((a,i)=>`<div class="row"><span><b>${esc(a.org)}</b> · ${esc(a.email)}<br><span class="fine">${esc(a.idea)} (${esc(a.budget)})</span></span>${a.status=='pending'?`<button class="btn sm" data-act="appok" data-i="${i}">Approve</button>`:`<span class="st approved">${a.status}</span>`}</div>`).join('')||'<p class="mu">None yet.</p>'}
<h2>Campaigns</h2>${S.camps.map(c=>`<div class="row"><span><b>${esc(c.title)}</b><br><span class="fine">${esc(c.sponsor)} · pool ${usd(c.reward*c.cap)}</span></span><span><span class="st ${c.funded?'approved':'rejected'}">${c.funded?'funded':'unfunded'}</span> <span class="st">${c.status}</span> ${!c.funded?`<button class="btn sm" data-act="fund" data-id="${c.id}">Mark funded</button>`:''}${c.funded&&c.status!='live'?` <button class="btn sm" data-act="live" data-id="${c.id}">Go live</button>`:''}</span></div>`).join('')}
<h2>Submissions</h2>${S.subs.map(s=>`<div class="row"><span><b>${esc(s.name)}</b> · ${esc((C(s.cid)||{}).title)}<br><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.url)}</a><br><span class="fine">Pay to: ${esc(s.payout)}</span></span><span>${s.status=='pending'?`<button class="btn sm" data-act="ok" data-id="${s.id}">Approve</button> <button class="btn sm ghost" data-act="no" data-id="${s.id}">Reject</button>`:s.status=='approved'?`<button class="btn sm" data-act="pay" data-id="${s.id}">Mark ${usd((C(s.cid)||{}).reward)} paid</button>`:`<span class="st ${s.status}">${s.status}</span>`}</span></div>`).join('')||'<p class="mu">No submissions yet.</p>'}`}
function render(){nav();$('#app').innerHTML={home,camp,mine,board,apply,build,admin}[view]();save()}
function loginDlg(){$('#dlg').innerHTML=`<h2 style="margin-top:0">Log in to Bybuzz</h2><p class="mu">Demo sign-in. Enter your details to continue.</p><label for="ln">Name</label><input id="ln" autocomplete="name"><label for="le">Email</label><input id="le" type="email" autocomplete="email"><p><button class="btn" data-act="dologin">Continue with Google</button> <button class="btn ghost" data-act="close">Cancel</button></p><button class="nb" data-act="demoadmin">Try as demo reviewer</button>`;$('#dlg').showModal()}
function submitDlg(id){const c=C(id);$('#dlg').innerHTML=`<h2 style="margin-top:0">Submit to ${esc(c.title)}</h2><p class="mu">${usd(c.reward)} USDT for every approved submission.</p><label for="sp">Platform</label><select id="sp">${c.platforms.map(p=>`<option>${p}</option>`).join('')}</select><label for="st">Your audience size</label><select id="st">${TIERS.map(t=>`<option value="${t[1]}">${t[1]} · ${t[2]}</option>`).join('')}</select><label for="su">Link to your content</label><input id="su" type="url" inputmode="url" placeholder="https://"><label for="sa">Where should we send USDT? (exchange UID or wallet address)</label><input id="sa" autocomplete="off"><p><button class="btn" data-act="send" data-id="${id}">Submit</button> <button class="btn ghost" data-act="close">Cancel</button></p><p class="fine">Only original content you created counts. Duplicate links are rejected.</p>`;$('#dlg').showModal()}
function doLogin(n,e,a){e=e.trim().toLowerCase();if(!n.trim()||!/^\S+@\S+$/.test(e)){toast('Enter a name and a valid email.');return}
S.users[e]=S.users[e]||{name:n.trim(),admin:false,sponsor:false};if(a)S.users[e].admin=true;S.me=e;$('#dlg').close();render();toast('Logged in');if(after){const f=after;after=null;f()}}
document.addEventListener('click',e=>{
const g=e.target.closest('[data-go]');if(g){go(g.dataset.go,g.dataset.id?+g.dataset.id:null);return}
const f=e.target.closest('[data-filt]');if(f){filt=f.dataset.filt;render();return}
const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act,id=+a.dataset.id,i=+a.dataset.i,v=x=>($('#'+x)||{}).value||'';
if(act=='list'){$('#list').scrollIntoView({behavior:'smooth'})}
else if(act=='join'){if(me())submitDlg(id);else{after=()=>submitDlg(id);loginDlg()}}
else if(act=='login'){loginDlg()}
else if(act=='close'){after=null;$('#dlg').close()}
else if(act=='dologin'){doLogin(v('ln'),v('le'))}
else if(act=='demoadmin'){doLogin('Demo Reviewer','reviewer@bybuzz.demo',true)}
else if(act=='who'){go('mine')}
else if(act=='logout'){S.me=null;go('home');toast('Logged out')}
else if(act=='send'){const c=C(id),url=v('su').trim(),pf=v('sp'),pay=v('sa').trim();
if(!RX[pf.split(' ')[0]].test(url)){toast('Paste a valid '+pf+' link.');return}
if(!pay){toast('Add where to send your USDT.');return}
if(S.subs.some(s=>s.url.toLowerCase()==url.toLowerCase())){toast('This link was already submitted.');return}
if(dl(c)==0){toast('This campaign has closed.');return}
S.subs.push({id:Date.now(),cid:id,email:S.me,name:me().name,platform:pf,url,payout:pay,tier:v('st'),status:'pending'});$('#dlg').close();go('mine');toast('Submitted. We will review it soon.')}
else if(act=='apply'){const run=()=>{if(!v('a1').trim()){toast('Add your organisation name.');return}S.apps.push({email:S.me,org:v('a1'),site:v('a2'),idea:v('a3'),budget:v('a4'),status:'pending'});render();toast('Application sent')};if(!me()){after=()=>go('apply');loginDlg()}else run()}
else if(act=='build'){const t=v('c1').trim(),pl=[...document.querySelectorAll('.cp:checked')].map(x=>x.value),r=+v('c4'),cap=+v('c5'),dd=+v('c6');if(!t||!pl.length||r<1||cap<1||dd<1){toast('Add a title, platforms, reward, slots and days.');return}
S.camps.push({id:Date.now(),sponsor:me().name,title:t,brief:v('c2'),cat:v('c3'),platforms:pl,reward:r,cap,end:Date.now()+dd*D,status:'pending',funded:false});go('home');toast('Sent for review')}
else if(act=='appok'){const x=S.apps[i];x.status='approved';if(S.users[x.email])S.users[x.email].sponsor=true;render();toast('Approved')}
else if(act=='fund'){C(id).funded=true;render()}
else if(act=='live'){C(id).status='live';render();toast('Campaign is live')}
else if(act=='ok'||act=='no'||act=='pay'){const s=S.subs.find(x=>x.id==id),c=C(s.cid);if(act=='ok'&&used(c)>=c.cap){toast('All reward slots are taken.');return}s.status=act=='ok'?'approved':act=='no'?'rejected':'paid';render()}
});
render();
</script>
</body>
</html>
